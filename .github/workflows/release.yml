name: release
# Started by hand only (Actions > release > Run workflow).
#
# Needs ONE repository secret, added by the owner (Settings > Secrets and variables > Actions):
#   CRAFT_KEY   the passphrase that opens secrets.enc (the distribution certificate; same file as craft-ios and PayTime)
#
# secrets.enc is not kept in this repo: each run fetches the one copy from keykeyg/craft-ios.
#
# The App Store profile is in signing/ (made with the App Store Connect key, which is never in this repo).
# The signed .ipa is kept as the run's artifact; whoever holds the App Store Connect key sends it to
# TestFlight. If ASC_KEY_ID, ASC_ISSUER_ID and ASC_KEY_P8 are ever added as secrets too, this job uploads it.
on:
  workflow_dispatch:
    inputs:
      version:
        description: Marketing version (e.g. 0.1.0)
        default: 0.1.0
      runner:
        description: Build machine
        default: macos-15

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

env:
  BUNDLE_ID: com.keyangodarzi.anyroom
  PROFILE_NAME: anyroom tvos appstore
  PROFILE_FILE: signing/anyroom_tvos.mobileprovision

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CRAFT_KEY: ${{ secrets.CRAFT_KEY }}
    steps:
      - uses: actions/checkout@v4
      - name: CRAFT_KEY opens secrets.enc, and the profile is here
        run: |
          [ -n "$CRAFT_KEY" ] || { echo "::error::Add the repository secret CRAFT_KEY, then run this again."; exit 1; }
          [ -f "$PROFILE_FILE" ] || { echo "::error::$PROFILE_FILE is missing: make it with the App Store Connect key first."; exit 1; }
          curl -fsSL -o secrets.enc https://raw.githubusercontent.com/keykeyg/craft-ios/main/secrets.enc
          pip install -q cryptography
          python3 scripts/vault.py open secrets.enc "$RUNNER_TEMP/vault"
          for f in ids.env dist.p12 p12_pass; do [ -s "$RUNNER_TEMP/vault/$f" ] || { echo "::error::secrets.enc has no $f"; exit 1; }; done
          rm -rf "$RUNNER_TEMP/vault"

  tvos:
    needs: preflight
    runs-on: ${{ github.event.inputs.runner }}
    timeout-minutes: 90
    env:
      CRAFT_KEY: ${{ secrets.CRAFT_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Signing keychain and profile
        run: |
          W="$RUNNER_TEMP"
          python3 -m pip install -q --break-system-packages cryptography 2>/dev/null || python3 -m pip install -q cryptography
          curl -fsSL -o secrets.enc https://raw.githubusercontent.com/keykeyg/craft-ios/main/secrets.enc
          python3 scripts/vault.py open secrets.enc "$W/vault"
          set -a; . "$W/vault/ids.env"; set +a
          echo "TEAM_ID=$TEAM_ID" >> "$GITHUB_ENV"
          KC="$W/anyroom.keychain-db"; KCPW="$(uuidgen)"
          security create-keychain -p "$KCPW" "$KC"
          security set-keychain-settings -lut 21600 "$KC"
          security unlock-keychain -p "$KCPW" "$KC"
          curl -fsSL -o "$W/wwdr.cer" https://www.apple.com/certificateauthority/AppleWWDRCAG3.cer && security import "$W/wwdr.cer" -k "$KC" -A || true
          security import "$W/vault/dist.p12" -k "$KC" -P "$(cat "$W/vault/p12_pass")" -A -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KCPW" "$KC" >/dev/null
          security list-keychains -d user -s "$KC" $(security list-keychains -d user | tr -d '"')
          echo "KC=$KC" >> "$GITHUB_ENV"
          rm -rf "$W/vault"
          UUID="$(security cms -D -i "$PROFILE_FILE" | plutil -extract UUID raw -)"
          for d in "$HOME/Library/MobileDevice/Provisioning Profiles" "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles"; do
            mkdir -p "$d"; cp "$PROFILE_FILE" "$d/$UUID.mobileprovision"
          done

      - name: Version and build number
        run: |
          PLIST=Apps/Stratix/Stratix/Info.plist
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString ${{ github.event.inputs.version }}" "$PLIST"
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion ${{ github.run_number }}" "$PLIST"

      - name: Archive
        run: |
          xcodebuild -workspace Stratix.xcworkspace -scheme Stratix -configuration Release \
            -destination 'generic/platform=tvOS' \
            -archivePath "$RUNNER_TEMP/Anyroom.xcarchive" \
            -clonedSourcePackagesDirPath "$RUNNER_TEMP/spm" \
            CODE_SIGN_STYLE=Manual CODE_SIGN_IDENTITY="Apple Distribution" DEVELOPMENT_TEAM="$TEAM_ID" \
            PROVISIONING_PROFILE_SPECIFIER="$PROFILE_NAME" OTHER_CODE_SIGN_FLAGS="--keychain $KC" \
            archive > archive.log 2>&1 || { grep -E "error:|\*\*" archive.log | tail -40; exit 1; }
          test -d "$RUNNER_TEMP/Anyroom.xcarchive"

      - name: Export the signed .ipa
        run: |
          cat > "$RUNNER_TEMP/export.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>export</string>
            <key>teamID</key><string>$TEAM_ID</string>
            <key>signingStyle</key><string>manual</string>
            <key>signingCertificate</key><string>Apple Distribution</string>
            <key>provisioningProfiles</key><dict><key>$BUNDLE_ID</key><string>$PROFILE_NAME</string></dict>
            <key>uploadSymbols</key><true/>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict></plist>
          PLIST
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/Anyroom.xcarchive" \
            -exportPath "$RUNNER_TEMP/out" -exportOptionsPlist "$RUNNER_TEMP/export.plist"
          mv "$RUNNER_TEMP"/out/*.ipa "$RUNNER_TEMP/out/Anyroom-tvOS-${{ github.run_number }}.ipa"

      - uses: actions/upload-artifact@v4
        with:
          name: anyroom-tvos-${{ github.run_number }}
          path: ${{ runner.temp }}/out/*.ipa
          retention-days: 30

      - name: Upload to App Store Connect (only if the ASC secrets exist)
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          if [ -z "$ASC_KEY_ID" ] || [ -z "$ASC_ISSUER_ID" ] || [ -z "$ASC_KEY_P8" ]; then
            echo "No App Store Connect secrets: the signed .ipa is in this run's artifacts for upload elsewhere."; exit 0
          fi
          mkdir -p ~/.appstoreconnect/private_keys
          printf '%s\n' "$ASC_KEY_P8" > ~/.appstoreconnect/private_keys/AuthKey_$ASC_KEY_ID.p8
          xcrun altool --upload-app -t tvos -f "$RUNNER_TEMP"/out/*.ipa --apiKey "$ASC_KEY_ID" --apiIssuer "$ASC_ISSUER_ID"
          rm -rf ~/.appstoreconnect/private_keys

      - name: Remove keychain
        if: always()
        run: '[ -n "$KC" ] && security delete-keychain "$KC" || true'
