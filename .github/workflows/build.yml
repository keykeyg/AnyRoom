name: build
# Compile check: builds the Apple TV app for the simulator on every push and pull request.
on:
  push:
    branches: [main]
    paths-ignore: [Tools/chiaki-build/**, .github/workflows/chiaki-tvos.yml, '**.md']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tvos:
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      # Builds for the generic Apple TV device target, unsigned: no simulator runtime needed on
      # the runner, and it compiles the same arm64 slice that ships. (Upstream's
      # Tools/dev/run_debug_build.sh asks for a named simulator the hosted runner doesn't have.)
      - name: Build (tvOS device, unsigned)
        run: |
          set -o pipefail
          xcodebuild -version
          xcodebuild -quiet -workspace Stratix.xcworkspace -scheme Stratix-Debug \
            -destination 'generic/platform=tvOS' \
            -derivedDataPath "$RUNNER_TEMP/dd" -clonedSourcePackagesDirPath "$RUNNER_TEMP/spm" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build 2>&1 | tee build.log
      - name: Report errors
        if: failure()
        run: |
          grep -E "error:|\*\* BUILD FAILED" build.log | head -40 | while IFS= read -r l; do echo "::error::${l//%/%25}"; done

  playstationkit:
    # Compiles the PlayStation package on its own for Apple TV, so its errors show up even before the app uses it.
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - name: Build PlayStationKit (tvOS device)
        working-directory: Packages/PlayStationKit
        run: |
          set -o pipefail
          xcodebuild -quiet -scheme PlayStationKit -destination 'generic/platform=tvOS' \
            -derivedDataPath "$RUNNER_TEMP/dd" build 2>&1 | tee build.log
      - name: Report errors
        if: failure()
        run: |
          grep -E "error:" Packages/PlayStationKit/build.log | sort -u | head -40 | while IFS= read -r l; do echo "::error::${l//%/%25}"; done
