name: build
# Compile check: builds the Apple TV app for the simulator on every push and pull request.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tvos:
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - name: Build (tvOS simulator)
        run: |
          set -o pipefail
          bash Tools/dev/run_debug_build.sh 2>&1 | tee build.log
      - name: Report errors
        if: failure()
        run: |
          grep -E "error:|\*\* BUILD FAILED" build.log | head -40 | while IFS= read -r l; do echo "::error::${l//%/%25}"; done
